name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: "ci-stub-32-char-secret-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ENCRYPTION_KEY: "Y2lzdHViZW5jcnlwdGlvbmtleXBsYWNlaG9sZGVy"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_GOOGLE_ID: "ci"
      AUTH_GOOGLE_SECRET: "ci"
      AUTH_MICROSOFT_ENTRA_ID_ID: "ci"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "ci"
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: "ci"
      GOOGLE_INTEGRATION_CLIENT_ID: "ci"
      GOOGLE_INTEGRATION_CLIENT_SECRET: "ci"
      MICROSOFT_INTEGRATION_CLIENT_ID: "ci"
      MICROSOFT_INTEGRATION_CLIENT_SECRET: "ci"
      STRIPE_SECRET_KEY: "sk_test_ci"
      STRIPE_WEBHOOK_SECRET: "whsec_ci"
      RESEND_API_KEY: "re_ci"
      CRON_SECRET: "ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel deploy --token "$VERCEL_TOKEN" --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
