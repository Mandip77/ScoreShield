name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # Stub values so Next.js build doesn't throw on missing env vars.
      # Real secrets are never used here — build-time env vars are public.
      NEXTAUTH_SECRET: "ci-stub-32-char-secret-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ENCRYPTION_KEY: "Y2lzdHViZW5jcnlwdGlvbmtleXBsYWNlaG9sZGVy"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_GOOGLE_ID: "ci"
      AUTH_GOOGLE_SECRET: "ci"
      AUTH_MICROSOFT_ENTRA_ID_ID: "ci"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "ci"
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: "ci"
      GOOGLE_INTEGRATION_CLIENT_ID: "ci"
      GOOGLE_INTEGRATION_CLIENT_SECRET: "ci"
      MICROSOFT_INTEGRATION_CLIENT_ID: "ci"
      MICROSOFT_INTEGRATION_CLIENT_SECRET: "ci"
      STRIPE_SECRET_KEY: "sk_test_ci"
      STRIPE_WEBHOOK_SECRET: "whsec_ci"
      RESEND_API_KEY: "re_ci"
      CRON_SECRET: "ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
